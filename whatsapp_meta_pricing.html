<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Business — Mudança na Cobrança da Meta | Salesforce PS LATAM</title>
<style>
:root{
  --brand:#0176D3; --brand-dark:#014486; --brand-navy:#032D60;
  --c-mkt:#0176D3; --c-util:#2E844A; --c-auth:#FE9339; --c-serv:#9050E9;
  --ok:#2E844A; --warn:#FE9339; --err:#EA001E; --info:#0176D3;
  --bg:#F3F3F3; --surface:#FFFFFF; --surface-2:#FAFAF9;
  --ink:#181818; --ink-2:#514F4D; --muted:#706E6B; --border:#DDDBDA; --border-2:#E5E5E5;
  --radius:14px; --shadow:0 2px 8px rgba(0,0,0,.08); --shadow-lg:0 8px 28px rgba(0,0,0,.14);
  --sidebar-w:264px;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}

/* ===== Sidebar ===== */
.sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:linear-gradient(180deg,#032D60 0%,#01346b 60%,#014486 100%);color:#fff;position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:40}
.sb-brand{padding:22px 22px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
.sb-brand .cloud{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;letter-spacing:.2px}
.sb-brand .cloud svg{flex:0 0 auto}
.sb-brand .sub{margin-top:8px;font-size:11.5px;color:#B9D4F1;font-weight:500;line-height:1.4}
.sb-nav{flex:1;overflow-y:auto;padding:14px 12px}
.sb-group{margin-bottom:16px}
.sb-group h4{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:#7FB0E0;padding:6px 12px;font-weight:700}
.sb-link{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:#DCE9F7;font-size:13.5px;font-weight:500;cursor:pointer;transition:.15s;border:none;background:none;width:100%;text-align:left}
.sb-link svg{flex:0 0 auto;opacity:.85}
.sb-link:hover{background:rgba(255,255,255,.09);color:#fff}
.sb-link.active{background:#fff;color:var(--brand-navy);font-weight:700}
.sb-link.active svg{opacity:1}
.sb-foot{padding:14px 20px;font-size:10.5px;color:#8FB6DE;border-top:1px solid rgba(255,255,255,.12)}

/* ===== Main ===== */
.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 26px}
.topbar .crumb{font-size:13px;color:var(--muted);font-weight:500}
.topbar .crumb b{color:var(--ink);font-weight:700}
.lang{display:flex;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:3px}
.lang button{border:none;background:none;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:.15s;font-family:inherit}
.lang button.active{background:var(--brand);color:#fff;box-shadow:0 1px 3px rgba(1,118,211,.4)}
#content{padding:32px 40px 60px;max-width:1080px;width:100%;margin:0 auto}
footer.pg{margin-left:var(--sidebar-w);padding:20px 40px;border-top:1px solid var(--border);color:var(--muted);font-size:11.5px;background:var(--surface)}

/* ===== Typography / blocks ===== */
.page-head{margin-bottom:26px}
.eyebrow{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--brand);background:#E8F4FD;padding:4px 11px;border-radius:6px;margin-bottom:12px}
h1{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1.2}
h2{font-size:21px;font-weight:700;margin:34px 0 14px;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
h2 .dot{width:9px;height:9px;border-radius:3px;background:var(--brand)}
h3{font-size:15.5px;font-weight:700;margin:2px 0 8px}
p{color:var(--ink-2);font-size:14.5px;margin-bottom:12px}
.lead{font-size:16px;color:var(--ink-2);max-width:70ch}
.muted{color:var(--muted);font-size:12.5px}
ul.clean{list-style:none;margin:6px 0 14px}
ul.clean li{position:relative;padding:5px 0 5px 24px;font-size:14px;color:var(--ink-2)}
ul.clean li::before{content:"";position:absolute;left:2px;top:12px;width:8px;height:8px;border-radius:3px;background:var(--brand)}

/* ===== Cards / grid ===== */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card.pad-lg{padding:26px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);border-top:3px solid var(--brand)}
.stat .num{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.stat .lbl{font-size:12px;color:var(--muted);font-weight:600;margin-top:6px}
.stat.s-up{border-top-color:var(--err)} .stat.s-down{border-top-color:var(--ok)} .stat.s-warn{border-top-color:var(--warn)}

/* callouts */
.callout{border-radius:12px;padding:15px 18px;margin:16px 0;font-size:13.5px;display:flex;gap:12px;align-items:flex-start;border:1px solid}
.callout .ic{flex:0 0 auto;margin-top:1px}
.callout.info{background:#E8F4FD;border-color:#B9DDF9;color:#014486}
.callout.warn{background:#FEF3E7;border-color:#FBD8AE;color:#8A4B08}
.callout.ok{background:#EBF7EE;border-color:#B7E1C4;color:#1B5E33}
.callout.crit{background:#FDECEC;border-color:#F7B9BD;color:#A60413}
.callout b{font-weight:700}

/* pills / badges */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px}
.pill.up{background:#FDECEC;color:#A60413}.pill.down{background:#EBF7EE;color:#1B5E33}.pill.flat{background:#F3F3F3;color:#514F4D}.pill.new{background:#EDE3FB;color:#5B2AAD}

/* bar chart */
.bars{margin:14px 0}
.bar-row{display:grid;grid-template-columns:130px 1fr auto;align-items:center;gap:12px;margin:9px 0;font-size:13px}
.bar-row .name{font-weight:600;color:var(--ink)}
.bar-track{background:#EFEFEF;border-radius:6px;height:22px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:6px 4px 4px 6px}
.bar-row .val{font-weight:700;font-size:12.5px;white-space:nowrap}

/* timeline */
.tl{position:relative;margin:18px 0 8px;padding-left:6px}
.tl::before{content:"";position:absolute;left:14px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--brand),#B9DDF9)}
.tl-item{position:relative;padding:0 0 22px 44px}
.tl-dot{position:absolute;left:6px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--brand);z-index:2}
.tl-item.hot .tl-dot{border-color:var(--err);box-shadow:0 0 0 4px #FDECEC}
.tl-item.soft .tl-dot{border-color:var(--ok)}
.tl-date{font-size:11.5px;font-weight:800;color:var(--brand);letter-spacing:.3px;text-transform:uppercase}
.tl-item.hot .tl-date{color:var(--err)}
.tl-item.soft .tl-date{color:var(--ok)}
.tl-title{font-weight:700;font-size:14.5px;margin:2px 0 3px}
.tl-desc{font-size:13px;color:var(--ink-2)}

/* table */
table.tbl{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0;background:var(--surface);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border)}
table.tbl th{background:var(--brand-navy);color:#fff;text-align:left;padding:11px 14px;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
table.tbl td{padding:11px 14px;border-top:1px solid var(--border);color:var(--ink-2);vertical-align:top}
table.tbl tr:nth-child(even) td{background:var(--surface-2)}
table.tbl td b{color:var(--ink)}

/* win/lose */
.wl{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.wl .col{border-radius:14px;padding:18px 20px;border:1px solid}
.wl .win{background:#EBF7EE;border-color:#B7E1C4}
.wl .lose{background:#FDECEC;border-color:#F7B9BD}
.wl h3{display:flex;align-items:center;gap:8px}
.wl ul{list-style:none;margin-top:8px}
.wl li{padding:6px 0 6px 22px;position:relative;font-size:13px;color:var(--ink-2)}
.wl .win li::before{content:"▲";position:absolute;left:0;top:6px;color:var(--ok);font-size:10px}
.wl .lose li::before{content:"▼";position:absolute;left:0;top:6px;color:var(--err);font-size:10px}

/* channel cards */
.chan{display:flex;flex-direction:column;gap:6px}
.chan .top{display:flex;align-items:center;justify-content:space-between}
.chan .nm{font-weight:700;font-size:14.5px}
.dots{letter-spacing:2px;font-size:12px;color:var(--brand)}
.dots .off{color:#D8D8D8}

/* calculator */
.calc-wrap{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:6px}
.field .hint{font-size:11px;color:var(--muted);font-weight:400;margin-top:3px}
.field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;color:var(--ink);background:#fff}
.field input:focus,.field select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(1,118,211,.15)}
.mix-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mix-sum{font-size:12px;font-weight:700;margin-top:4px}
.mix-sum.ok{color:var(--ok)}.mix-sum.bad{color:var(--err)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:120px;padding:9px;border:1px solid var(--border);background:#fff;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink-2);transition:.15s}
.seg button.on{border-color:var(--brand);background:#E8F4FD;color:var(--brand-dark)}
details.adv{margin-top:8px;border:1px dashed var(--border);border-radius:10px;padding:4px 14px}
details.adv summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--brand);padding:8px 0}
.rate-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:10px}
.result-hero{background:linear-gradient(135deg,#032D60,#0176D3);color:#fff;border-radius:16px;padding:24px;box-shadow:var(--shadow-lg)}
.result-hero .rlbl{font-size:12px;color:#B9D4F1;font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.result-hero .rbig{font-size:38px;font-weight:800;letter-spacing:-1px;margin:4px 0}
.result-hero .rsub{font-size:12.5px;color:#CFE3F7}
.breakdown{margin-top:16px}
.compare-box{background:#FEF3E7;border:1px solid #FBD8AE;border-radius:12px;padding:14px 16px;margin-top:14px;font-size:13px;color:#8A4B08}
.step{display:flex;gap:12px;margin:10px 0}
.step .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.step .tx{font-size:13px;color:var(--ink-2)}
.step .tx b{color:var(--ink)}

/* SF positioning */
.hero-sf{background:linear-gradient(120deg,#032D60,#0176D3 90%);color:#fff;border-radius:18px;padding:32px;box-shadow:var(--shadow-lg);margin-bottom:24px}
.hero-sf h1{color:#fff}
.hero-sf p{color:#DCE9F7;font-size:15px;max-width:62ch}
.cap{display:flex;gap:14px;align-items:flex-start;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.cap .ci{flex:0 0 42px;height:42px;border-radius:10px;background:#E8F4FD;display:flex;align-items:center;justify-content:center}
.cap h3{margin:0 0 4px}
.cap p{font-size:13px;margin:0}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:14px 0}
.flow .node{background:#fff;border:1.5px solid var(--brand);color:var(--brand-dark);border-radius:10px;padding:10px 14px;font-size:12.5px;font-weight:700}
.flow .arr{color:var(--brand);font-weight:800}

.hidden{display:none!important}
@media(max-width:940px){
  .sidebar{transform:translateX(-100%);transition:.25s}.sidebar.open{transform:none}
  .main,footer.pg{margin-left:0}
  .g2,.g3,.g4,.calc-wrap,.wl,.mix-grid,.rate-grid{grid-template-columns:1fr}
  #content{padding:24px 18px 50px}
  .menu-btn{display:flex!important}
}
.menu-btn{display:none;background:var(--brand);color:#fff;border:none;border-radius:8px;width:38px;height:38px;align-items:center;justify-content:center;cursor:pointer}
</style>
</head>

};

/* ============ state + render ============ */
let LANG='pt', PAGE='overview';
const LOCALE={pt:'pt-BR',es:'es-419',en:'en-US'};
const brl=v=>new Intl.NumberFormat(LOCALE[LANG],{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(v);
const brl2=v=>new Intl.NumberFormat(LOCALE[LANG],{style:'currency',currency:'BRL',minimumFractionDigits:3,maximumFractionDigits:3}).format(v);
const numf=v=>new Intl.NumberFormat(LOCALE[LANG]).format(v);

function buildNav(){
  const c=CHROME[LANG]; const nav=document.getElementById('nav'); nav.innerHTML='';
  c.groups.forEach(([title,items])=>{
    const g=document.createElement('div'); g.className='sb-group';
    g.innerHTML='<h4>'+title+'</h4>';
    items.forEach(([id,label])=>{
      const b=document.createElement('button'); b.className='sb-link'+(id===PAGE?' active':'');
      b.innerHTML='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="'+NAV_ICONS[id]+'"/></svg>'+label;
      b.onclick=()=>{PAGE=id;render();document.getElementById('sidebar').classList.remove('open');window.scrollTo(0,0);};
      g.appendChild(b);
    });
    nav.appendChild(g);
  });
}
function crumbLabel(){
  for(const [,items] of CHROME[LANG].groups) for(const [id,label] of items) if(id===PAGE) return label;
  return '';
}
function render(){
  document.documentElement.lang=LANG;
  buildNav();
  document.querySelector('[data-c="brandsub"]').innerHTML=CHROME[LANG].brandsub;
  document.querySelector('[data-c="foot"]').innerHTML=CHROME[LANG].foot;
  document.querySelector('[data-c="crumbroot"]').textContent=CHROME[LANG].crumbroot;
  document.getElementById('crumb').innerHTML='› '+crumbLabel();
  document.getElementById('pgfoot').innerHTML=CHROME[LANG].foot2;
  const el=document.getElementById('content');
  el.innerHTML=(PAGES[PAGE]&&PAGES[PAGE][LANG])||'<p>—</p>';
  if(PAGE==='calculator') initCalculator();
}
document.getElementById('lang').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  LANG=b.dataset.l;
  document.querySelectorAll('#lang button').forEach(x=>x.classList.toggle('active',x===b));
  render();
});
document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');

/* ============ calculator engine ============ */
const CALC_T={
  pt:{using:"Usando IA de terceiros / atendimento humano",meta:"Usando Meta Business Agents",
      resherolbl:"Custo mensal estimado (novo modelo)",resherosub:"após 1º out 2026, incluindo cobrança por respostas",
      annual:"Projeção anual",bd:"Onde o custo é gerado",repl:"Respostas de atendimento",
      cmp_meta:"Se você migrasse para Meta Business Agents, as respostas ficariam isentas — economia estimada de ",
      cmp_third:"Como você usa IA de terceiros/humano, as respostas passam a custar R$ 0,035 cada a partir de out/2026 — ",
      permo:"/mês",peryr:"/ano",free:"grátis na janela",badmix:"A soma das categorias deve dar 100%.",okmix:"Distribuição = 100% ✓"},
  es:{using:"Usando IA de terceros / atención humana",meta:"Usando Meta Business Agents",
      resherolbl:"Costo mensual estimado (nuevo modelo)",resherosub:"tras el 1 oct 2026, incluyendo cobro por respuestas",
      annual:"Proyección anual",bd:"Dónde se genera el costo",repl:"Respuestas de atención",
      cmp_meta:"Si migraras a Meta Business Agents, las respuestas quedarían exentas — ahorro estimado de ",
      cmp_third:"Como usas IA de terceros/humano, las respuestas costarán R$ 0,035 cada una desde oct/2026 — ",
      permo:"/mes",peryr:"/año",free:"gratis en la ventana",badmix:"La suma de categorías debe dar 100%.",okmix:"Distribución = 100% ✓"},
  en:{using:"Using third-party AI / human agents",meta:"Using Meta Business Agents",
      resherolbl:"Estimated monthly cost (new model)",resherosub:"after Oct 1 2026, including per-reply charge",
      annual:"Annual projection",bd:"Where cost is generated",repl:"Service replies",
      cmp_meta:"If you moved to Meta Business Agents, replies would be exempt — estimated saving of ",
      cmp_third:"Since you use third-party AI/human, replies will cost R$ 0.035 each from Oct/2026 — ",
      permo:"/mo",peryr:"/yr",free:"free in window",badmix:"Category split must total 100%.",okmix:"Split = 100% ✓"}
};
function initCalculator(){
  const $=id=>document.getElementById(id);
  const ids=['cVol','mMkt','mUtil','mAuth','mServ','cRepl','rMkt','rUtil','rAuth','rRepl'];
  const agentBtns=document.querySelectorAll('#agentSeg button');
  let agent='third';
  agentBtns.forEach(b=>b.onclick=()=>{agent=b.dataset.v;agentBtns.forEach(x=>x.classList.toggle('on',x===b));compute();});
  function compute(){
    const t=CALC_T[LANG];
    const vol=+$('cVol').value||0;
    const mk=+$('mMkt').value||0,ut=+$('mUtil').value||0,au=+$('mAuth').value||0,sv=+$('mServ').value||0;
    const sum=mk+ut+au+sv;
    const sumEl=$('mixSum');
    if(Math.round(sum)!==100){sumEl.className='mix-sum bad';sumEl.textContent='Σ '+sum+'% — '+t.badmix;}
    else{sumEl.className='mix-sum ok';sumEl.textContent=t.okmix;}
    const rMkt=+$('rMkt').value||0,rUtil=+$('rUtil').value||0,rAuth=+$('rAuth').value||0,rRepl=+$('rRepl').value||0;
    const nMkt=vol*mk/100,nUtil=vol*ut/100,nAuth=vol*au/100,nServ=vol*sv/100;
    const cMkt=nMkt*rMkt,cUtil=nUtil*rUtil,cAuth=nAuth*rAuth,cServ=0;
    const repl=+$('cRepl').value||0;
    const cRepl=(agent==='meta')?0:repl*rRepl;
    const total=cMkt+cUtil+cAuth+cServ+cRepl;
    $('resHero').textContent=brl(total);
    $('resAnnual').textContent=brl(total*12);
    const rows=[['Marketing',cMkt,'var(--c-mkt)'],['Utility',cUtil,'var(--c-util)'],['Authentication',cAuth,'var(--c-auth)'],['Service',cServ,'var(--c-serv)'],[t.repl,cRepl,'#514F4D']];
    const max=Math.max(...rows.map(r=>r[1]),1);
    $('bd').innerHTML=rows.map(([n,v,c])=>{
      const w=Math.max(v/max*100,v>0?4:0);
      const tag=(n==='Service'&&v===0)?' <span class="muted">('+t.free+')</span>':'';
      return '<div class="bar-row"><span class="name">'+n+'</span><div class="bar-track"><div class="bar-fill" style="width:'+w+'%;background:'+c+'"></div></div><span class="val">'+brl(v)+tag+'</span></div>';
    }).join('');
    const cmp=$('cmpBox');
    if(agent==='meta'){cmp.innerHTML=t.cmp_meta+'<b>'+brl(repl*rRepl)+t.permo+'</b> ('+brl(repl*rRepl*12)+t.peryr+').';}
    else{cmp.innerHTML=t.cmp_third+'<b>'+brl(cRepl)+t.permo+'</b> ('+brl(cRepl*12)+t.peryr+').';}
  }
  ids.forEach(id=>{const e=$(id);if(e)e.oninput=compute;});
  compute();
}

/* boot */
render();
</script>
